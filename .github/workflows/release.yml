name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.10.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: macos-15
    # Generous because notarisation is a queue at Apple, not work we control.
    # The first submission from a newly issued Developer ID is routinely the
    # slowest — a 30-minute cap killed one after 26 minutes of "In Progress",
    # with the build itself having already eaten four of them.
    timeout-minutes: 90
    steps:
      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.10.0 or v0.10.0-beta.1, got: $REQUESTED_TAG" >&2
            exit 1
          fi

          VERSION="${REQUESTED_TAG#v}"
          BUNDLE_VERSION="${VERSION%%-*}"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          # Needed by the ancestry check below; a shallow clone has no history
          # to compare against main.
          fetch-depth: 0

      # Refuse to build a tag that is not on main.
      #
      # `main` is protected — required checks, no force pushes, no deletions —
      # but **branch protection does not protect tags**. A tag can point at any
      # commit in the repository, including one on an unreviewed branch, and this
      # workflow fires on `v*` regardless of where that commit came from. So
      # without this, the path to a signed, notarised build carrying the Apple
      # certificate is: push any branch, tag it, done.
      #
      # **This step is not the security control**, and it must not be mistaken
      # for one: anyone who can modify this file can delete it in the same commit
      # they tag. The controls are a tag ruleset restricting who may create `v*`
      # and a protected `release` environment that pauses for a second person
      # before any secret-bearing step. Both are repository settings and neither
      # lives here.
      #
      # What this does buy is the accident: releasing from a branch that was
      # never reviewed, which is a mistake a maintainer can make on any evening.
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin main
          TAG_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::${{ steps.release.outputs.tag }} points at $TAG_SHA, which is not an ancestor of origin/main. Releases are cut from reviewed commits on main." >&2
            exit 1
          fi
          echo "$TAG_SHA is on main."

      # The same check the Package step makes, made here instead of forty
      # minutes later. A tag whose version does not match the committed
      # MARKETING_VERSION cannot produce a valid release, and finding that out
      # after a full build, the test suites and a notarisation queue wastes the
      # lot. v0.12.1 did exactly that: a package-only tag, cut so the Swift
      # Package Index had a version whose tree contained the root manifest, ran
      # the entire build before failing on a mismatch it could have caught in
      # one second.
      - name: The tag must match the version in the tree
        env:
          EXPECTED: ${{ steps.release.outputs.bundle_version }}
        run: |
          set -euo pipefail
          COMMITTED="$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*"\(.*\)".*/\1/')"
          if [[ "$COMMITTED" != "$EXPECTED" ]]; then
            echo "::error::project.yml has MARKETING_VERSION $COMMITTED but the tag asks for $EXPECTED." >&2
            echo "Bump MARKETING_VERSION and CURRENT_PROJECT_VERSION, commit, then tag." >&2
            echo "If this is a package-only tag rather than an app release, it does not belong on v*." >&2
            exit 1
          fi
          echo "project.yml and the tag agree on $EXPECTED"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test before shipping
        run: |
          set -euo pipefail
          swift test -c release --package-path Packages/PaintKit
          xcodebuild -project ItsPaint.xcodeproj -scheme ItsPaint \
            -destination 'platform=macOS' test

      # Signing is deliberately not in project.yml: ci.yml builds Release on
      # every push, and a hardcoded Developer ID identity would fail every one
      # of those runs on a machine that has no certificate. The identity is
      # supplied here, where the certificate exists.
      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12:-}" ]]; then
            echo "::warning::No MACOS_CERTIFICATE_P12 secret — falling back to ad-hoc signing."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Long enough for the whole job; the runner is destroyed afterwards.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend rather than replace: dropping the login keychain takes the
          # Apple intermediates with it and the chain stops validating.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/^ *//' -e 's/"//g')
          rm -f "$P12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "The certificate imported but no Developer ID Application identity resolved." >&2
            exit 1
          fi
          # Derived from the identity rather than carried as its own secret, so
          # the two can never disagree about which team is signing.
          TEAM="$(sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p' <<< "$IDENTITY")"
          test -n "$TEAM"

          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing as: $IDENTITY"

      - name: Build universal release
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGN_TEAM: ${{ steps.signing.outputs.team }}
        run: |
          set -euo pipefail
          ARGS=(
            -project ItsPaint.xcodeproj -scheme ItsPaint
            -configuration Release -destination 'generic/platform=macOS'
            -derivedDataPath build ARCHS="arm64 x86_64"
            ONLY_ACTIVE_ARCH=NO
          )
          if [[ "$SIGN_IDENTITY" != "-" ]]; then
            # --timestamp is not optional: the notary service rejects a
            # signature without a secure timestamp.
            ARGS+=(
              CODE_SIGN_IDENTITY="$SIGN_IDENTITY"
              DEVELOPMENT_TEAM="$SIGN_TEAM"
              OTHER_CODE_SIGN_FLAGS="--timestamp"
            )
          fi
          xcodebuild "${ARGS[@]}" build

      # Verify exactly what we ship rather than implying Gatekeeper approval it
      # does not have. Both paths are asserted: an ad-hoc build must say ad-hoc,
      # and a Developer ID build must carry the expected team and a timestamp.
      - name: Package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_BUNDLE_VERSION: ${{ steps.release.outputs.bundle_version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          SIGN_TEAM: ${{ steps.signing.outputs.team }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/ItsPaint.app"
          DIST="$GITHUB_WORKSPACE/dist"
          INFO_PLIST="$APP/Contents/Info.plist"
          ENTITLEMENTS="$RUNNER_TEMP/ItsPaint-entitlements.plist"
          STAGING="$(mktemp -d "$RUNNER_TEMP/itspaint-dmg.XXXXXX")"
          VERIFY_DIR="$(mktemp -d "$RUNNER_TEMP/itspaint-verify.XXXXXX")"
          DMG="$DIST/ItsPaint-$VERSION.dmg"
          ZIP="$DIST/ItsPaint-$VERSION.zip"

          test -d "$APP"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          if [[ "$BUNDLE_VERSION" != "$EXPECTED_BUNDLE_VERSION" ]]; then
            echo "Bundle version $BUNDLE_VERSION does not match release $EXPECTED_BUNDLE_VERSION" >&2
            exit 1
          fi

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          EXECUTABLE="$APP/Contents/MacOS/$EXECUTABLE_NAME"
          lipo "$EXECUTABLE" -verify_arch arm64 x86_64
          echo "Architectures: $(lipo -archs "$EXECUTABLE")"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > "$ENTITLEMENTS" 2>/dev/null
          for entitlement in \
            com.apple.security.app-sandbox \
            com.apple.security.files.bookmarks.app-scope \
            com.apple.security.files.user-selected.read-write
          do
            value="$(/usr/libexec/PlistBuddy -c "Print :$entitlement" "$ENTITLEMENTS")"
            if [[ "$value" != "true" ]]; then
              echo "Expected signed entitlement $entitlement=true, got: $value" >&2
              exit 1
            fi
          done
          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          if [[ "$SIGNED" == "true" ]]; then
            if [[ "$SIGNATURE_INFO" != *"Authority=Developer ID Application"* ]]; then
              echo "Expected a Developer ID signature, got:" >&2
              echo "$SIGNATURE_INFO" >&2
              exit 1
            fi
            if [[ "$SIGNATURE_INFO" != *"TeamIdentifier=$SIGN_TEAM"* ]]; then
              echo "Signed by an unexpected team; wanted $SIGN_TEAM" >&2
              exit 1
            fi
            # No timestamp means the notary service will reject it later, and
            # it is far cheaper to find that out here than after a submission.
            if [[ "$SIGNATURE_INFO" != *"Timestamp="* ]]; then
              echo "Expected a secure timestamp in the Release signature" >&2
              exit 1
            fi
          elif [[ "$SIGNATURE_INFO" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc signature" >&2
            exit 1
          fi
          if [[ "$SIGNATURE_INFO" != *"runtime"* ]]; then
            echo "Expected Hardened Runtime in the Release signature" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.get-task-allow' "$ENTITLEMENTS" >/dev/null 2>&1
          then
            echo "Release must not contain get-task-allow" >&2
            exit 1
          fi

          mkdir -p "$DIST"

          # Notarise the **app** first, then build the disk image from the
          # stapled copy, then notarise the image.
          #
          # Two submissions, deliberately. Notarising only the image leaves the
          # app inside it unstapled — the ticket is attached to the `.dmg` file,
          # not to the bundle — so an app dragged out to Applications has to ask
          # Apple on first launch, which is the one thing stapling exists to
          # avoid. `stapler validate` on that copy says so outright.
          #
          # A single submission cannot fix it: stapling the app changes the
          # image's own hash, and the image needs a ticket for *its* hash. Once
          # the account is warm each submission takes about a minute, so the
          # second one is cheap.
          notarise() {
            local target="$1" log="$RUNNER_TEMP/notarytool-$(basename "$target").log"
            set +e
            xcrun notarytool submit "$target" \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "${NOTARY_TEAM_ID:-$SIGN_TEAM}" \
              --wait --timeout 75m 2>&1 | tee "$log"
            local code=${PIPESTATUS[0]}
            set -e
            NOTARY_ID="$(awk '/^ *id: /{print $2; exit}' "$log")"
            echo "Notarisation submission id for $(basename "$target"): ${NOTARY_ID:-unknown}"
            # A wait that ran out is not a rejection — Apple keeps working the
            # submission. Report it as unfinished so a green build survives.
            if grep -q "Timeout of" "$log"; then
              NOTARY_RESULT=timeout
              return 0
            fi
            [[ $code -eq 0 ]] && NOTARY_RESULT=accepted || NOTARY_RESULT=failed
            return $code
          }

          NOTARISED=false
          if [[ "$SIGNED" == "true" && -n "${NOTARY_APPLE_ID:-}" && -n "${NOTARY_PASSWORD:-}" ]]; then
            APP_ARCHIVE="$RUNNER_TEMP/ItsPaint-notarise.zip"
            ditto -c -k --keepParent "$APP" "$APP_ARCHIVE"
            notarise "$APP_ARCHIVE"

            if [[ "$NOTARY_RESULT" == "accepted" ]]; then
              # Staple the bundle before it is ever copied anywhere.
              xcrun stapler staple "$APP"

              ditto "$APP" "$STAGING/ItsPaint.app"
              ln -s /Applications "$STAGING/Applications"
              hdiutil create -volname "ItsPaint $VERSION" -srcfolder "$STAGING" \
                -ov -format UDZO "$DMG"

              notarise "$DMG"
              if [[ "$NOTARY_RESULT" == "accepted" ]]; then
                xcrun stapler staple "$DMG"
                NOTARISED=true
              fi
            fi
          fi

          if [[ "$NOTARISED" != "true" ]]; then
            if [[ "$SIGNED" == "true" ]]; then
              echo "::warning::Shipping without a stapled notarisation ticket."
            fi
            # The image still has to exist.
            if [[ ! -f "$DMG" ]]; then
              ditto "$APP" "$STAGING/ItsPaint.app"
              ln -s /Applications "$STAGING/Applications"
              hdiutil create -volname "ItsPaint $VERSION" -srcfolder "$STAGING" \
                -ov -format UDZO "$DMG"
            fi
          fi
          echo "NOTARISED=$NOTARISED" >> "$GITHUB_ENV"

          # Built after stapling so the archive carries the ticket too.
          ditto -c -k --keepParent "$APP" "$ZIP"

          hdiutil verify "$DMG"
          ditto -x -k "$ZIP" "$VERIFY_DIR"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/ItsPaint.app"

          # The assessment Gatekeeper itself will make on a user's Mac.
          if [[ "$NOTARISED" == "true" ]]; then
            spctl -a -vvv -t exec "$VERIFY_DIR/ItsPaint.app"
            xcrun stapler validate "$DMG"
            xcrun stapler validate "$VERIFY_DIR/ItsPaint.app"

            # And the copy a user actually drags out of the disk image, which is
            # the one that was silently unstapled before.
            MOUNT="$(hdiutil attach "$DMG" -nobrowse -readonly | awk -F'\t' 'END{print $NF}')"
            xcrun stapler validate "$MOUNT/ItsPaint.app"
            spctl -a -vvv -t exec "$MOUNT/ItsPaint.app"
            hdiutil detach "$MOUNT" -quiet
          fi

          # Last, because stapling rewrites the files it tickets.
          (
            cd "$DIST"
            shasum -a 256 "ItsPaint-$VERSION.dmg" "ItsPaint-$VERSION.zip" > checksums.txt
          )
          cat "$DIST/checksums.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ItsPaint-${{ steps.release.outputs.version }}
          path: |
            dist/ItsPaint-${{ steps.release.outputs.version }}.dmg
            dist/ItsPaint-${{ steps.release.outputs.version }}.zip
            dist/checksums.txt
          if-no-files-found: error
          compression-level: 0

      # The install instructions have to match what was actually produced.
      # Telling a notarised build's users to clear a quarantine flag teaches
      # them to do it reflexively, which is a habit worth not creating.
      - name: Compose install instructions
        id: install
        run: |
          set -euo pipefail
          {
            echo 'text<<INSTALL_EOF'
            echo '1. Download the `.dmg`, open it, drag **ItsPaint** to Applications.'
            if [[ "${NOTARISED:-false}" == "true" ]]; then
              echo '2. Open it. The build is signed with a Developer ID and notarised'
              echo '   by Apple, so Gatekeeper lets it through with no extra steps.'
            else
              echo '2. This build is **not notarised**. Control-click the app, choose'
              echo '   **Open**, then confirm **Open**. If macOS still blocks it, clear'
              echo '   the download quarantine once:'
              echo '   ```'
              echo '   xattr -dr com.apple.quarantine /Applications/ItsPaint.app'
              echo '   ```'
            fi
            echo 'INSTALL_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ItsPaint ${{ steps.release.outputs.version }}
          draft: true
          # A suffix means a pre-release. **Being 0.x does not.**
          #
          # This used to also flag every 0.x, which is defensible as semver and
          # wrong as a GitHub flag: `prerelease` means "not the build you should
          # download", and it excludes the release from `releases/latest`. The
          # Homebrew cask's livecheck is `strategy :github_latest`, so every
          # shipped version was invisible to `brew upgrade` until someone cleared
          # the flag by hand — which is what happened to 0.12.0, and then to
          # 0.13.0. A step that has to be undone manually after every release is
          # a step that will eventually not be.
          prerelease: ${{ contains(steps.release.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ItsPaint-${{ steps.release.outputs.version }}.dmg
            dist/ItsPaint-${{ steps.release.outputs.version }}.zip
            dist/checksums.txt
          body: |
            ItsPaint `${{ steps.release.outputs.version }}` for macOS 14 or later.
            Built from `${{ steps.release.outputs.tag }}` by GitHub Actions.

            ## Install
            ${{ steps.install.outputs.text }}

            Verify your download against `checksums.txt`. Full notes are in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.release.outputs.tag }}/CHANGELOG.md).
