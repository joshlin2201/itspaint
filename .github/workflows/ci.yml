name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      # The engine is a plain Swift package with no UI and no dependencies, so it is
      # the fast signal on every push: about six seconds in debug, and a fifth of a
      # second in the release step below, where the optimiser is actually on.
      # Run from the ROOT, which is the command CONTRIBUTING and the README give a
      # contributor. CI used to test only the nested manifest while the docs said
      # `swift test` — so a root manifest whose test targets were misconfigured would
      # have passed CI and failed the first person who followed the instructions.
      - name: Test PaintKit (debug)
        run: swift test
      # The throughput guards only assert in release: unoptimised timings
      # measure the compiler, not the algorithm.
      - name: Test PaintKit (release, includes performance budgets)
        run: swift test -c release
      # A second manifest sits at the repository root so that a plain `swift build`,
      # a `.package(url:)` dependency and the Swift Package Index can all see the
      # engine. It vends the same targets from the same directories, so the two can
      # only disagree by mistake — this is what notices.
      - name: Root and nested manifests agree
        run: |
          names() {
            swift package --package-path "$1" dump-package | python3 -c \
              'import json,sys; d=json.load(sys.stdin); print(sorted(p["name"] for p in d["products"]), sorted(t["name"] for t in d["targets"]))'
          }
          root=$(names .)
          nested=$(names Packages/PaintKit)
          echo "root:   $root"
          echo "nested: $nested"
          if [ "$root" != "$nested" ]; then
            echo "::error::Package.swift and Packages/PaintKit/Package.swift declare different products or targets."
            exit 1
          fi
      # What someone gets from `git clone && swift build`, with no Xcode project.
      - name: Build from the repository root
        run: swift build

  app:
    name: App build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: |
          xcodebuild -project ItsPaint.xcodeproj -scheme ItsPaint \
            -destination 'platform=macOS' -configuration Release build
      # These run the real AppKit views offscreen, so they need a GUI session —
      # which the macOS runners provide.
      - name: Test
        run: |
          xcodebuild -project ItsPaint.xcodeproj -scheme ItsPaint \
            -destination 'platform=macOS' test
