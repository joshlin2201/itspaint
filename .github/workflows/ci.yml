name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      # The engine is a plain Swift package with no UI and no dependencies, so it is
      # the fast signal on every push: about six seconds in debug, and a fifth of a
      # second in the release step below, where the optimiser is actually on.
      # Run from the ROOT, which is the command CONTRIBUTING and the README give a
      # contributor. CI used to test only the nested manifest while the docs said
      # `swift test` — so a root manifest whose test targets were misconfigured would
      # have passed CI and failed the first person who followed the instructions.
      - name: Test PaintKit (debug)
        run: swift test
      # The throughput guards only assert in release: unoptimised timings
      # measure the compiler, not the algorithm.
      - name: Test PaintKit (release, includes performance budgets)
        run: swift test -c release
      # A second manifest sits at the repository root so that a plain `swift build`,
      # a `.package(url:)` dependency and the Swift Package Index can all see the
      # engine. It vends the same targets from the same directories, so the two can
      # only disagree by mistake — this is what notices.
      # Platforms are in here because they were not, and the deployment target is
      # the one field a consumer feels before any of their code compiles: SwiftPM
      # refuses to resolve when the dependency's floor is above the consumer's.
      - name: Root and nested manifests agree
        run: |
          names() {
            swift package --package-path "$1" dump-package | python3 -c \
              'import json,sys; d=json.load(sys.stdin); print(sorted(p["name"] for p in d["products"]), sorted(t["name"] for t in d["targets"]), sorted((p["platformName"], p["version"]) for p in d["platforms"]))'
          }
          root=$(names .)
          nested=$(names Packages/PaintKit)
          echo "root:   $root"
          echo "nested: $nested"
          if [ "$root" != "$nested" ]; then
            echo "::error::Package.swift and Packages/PaintKit/Package.swift declare different products, targets or platforms."
            exit 1
          fi
      # What someone gets from `git clone && swift build`, with no Xcode project.
      - name: Build from the repository root
        run: swift build

  consumer:
    name: README snippet builds as a dependency
    runs-on: macos-15
    # The README tells a stranger to add one `.package(url:)` line and gives four
    # lines of code. Until this job existed that pair had been compiled exactly once,
    # by hand, against 0.13.1 — and the README said so in the present tense for four
    # releases afterwards. It also asserts the floor: this package declares macOS 12,
    # so raising the engine's deployment target fails here rather than in someone
    # else's resolver.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build the four README lines from outside the repository
        run: |
          set -euo pipefail
          # Outside the checkout on purpose: inside it, SwiftPM would find the
          # repository's own manifests and stop proving anything about a consumer.
          consumer="$RUNNER_TEMP/Consumer"
          mkdir -p "$consumer/Sources/Consumer"
          cat > "$consumer/Package.swift" <<EOF
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "Consumer",
              platforms: [.macOS(.v12)],
              dependencies: [.package(path: "$GITHUB_WORKSPACE")],
              targets: [
                  .executableTarget(
                      name: "Consumer",
                      dependencies: [.product(name: "PaintKit", package: "itspaint")]
                  )
              ]
          )
          EOF
          # The code is READ OUT OF THE README rather than copied here. A copy would
          # compile happily while the README drifted away from it, which is the exact
          # failure this job exists to catch, one level up.
          python3 - "$consumer/Sources/Consumer/main.swift" <<'PY'
          import re, sys

          readme = open("README.md").read()
          blocks = [b for b in re.findall(r"```swift\n(.*?)```", readme, re.S)
                    if "import PaintKit" in b]
          if len(blocks) != 1:
              sys.exit(f"expected one ```swift block importing PaintKit in README.md, found {len(blocks)}")
          block = blocks[0]
          if "removeBackground" not in block:
              sys.exit("the README's PaintKit example no longer calls removeBackground — "
                       "this job would compile something that proves nothing")

          # Swift wants imports at the top, and the README's snippet leaves `input`
          # and `output` to the reader. Everything between is the README's, unedited.
          imports = [l for l in block.splitlines() if l.startswith("import ")]
          body = [l for l in block.splitlines() if not l.startswith("import ")]
          open(sys.argv[1], "w").write("\n".join([
              "import Foundation", *imports,
              'let input = URL(fileURLWithPath: CommandLine.arguments[1])',
              'let output = URL(fileURLWithPath: CommandLine.arguments[2])',
              *body,
          ]) + "\n")
          PY
          echo "--- what the README actually says, and what is being compiled ---"
          cat "$consumer/Sources/Consumer/main.swift"
          swift build --package-path "$consumer"

  app:
    name: App build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: |
          xcodebuild -project ItsPaint.xcodeproj -scheme ItsPaint \
            -destination 'platform=macOS' -configuration Release build
      # These run the real AppKit views offscreen, so they need a GUI session —
      # which the macOS runners provide.
      - name: Test
        run: |
          xcodebuild -project ItsPaint.xcodeproj -scheme ItsPaint \
            -destination 'platform=macOS' test
